<!DOCTYPE html> 

<html lang="en"> 

<head> 

    <meta charset="UTF-8"> 

    <title>Task 3 - Semantic Layout Challenge</title> 

    <link rel="stylesheet" href="flexstyle.css"> 

</head> 

<body> 

  

    <div class="page-container"> 

  

        <header> 

            <!-- TASK: Add Logo div and Heading 1 here --> 

            <div class="logo">
                    <img src="Movie.png" width="100">
            </div>

            <div class="header-text" style="margin-left: 20px;">
                    <h1>Movie Yeah!1!</h1>
            </div>

        </header> 

  

        <nav> 

            <!-- TASK: Create a list for: Home, About Us, Contact Us --> 

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>

        </nav> 

  

        <main class="main-content"> 

            <!-- TASK: Add the two content boxes (text and image) --> 
                <div class="content-box">
                    <h2>Reasons Why Ritik Aura</h2>
                    <p>Ritik Aura is a fantastic choice for anyone looking for quality and reliability. </p>
                </div>

                <div class="image-box">
                    <img src="Update.png" alt="Image" width="250px">
                </div>

        </main> 

  

        <footer> 

            <!-- TASK: Add footer info and the social links div --> 

            <h1>Unordered list of footer info</h1>

            <div class="social-links">
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Twitter</a></li>
                    <li><a href="#">Instagram</a></li>
                </ul>
            </div>
        </footer> 

  

    </div> 

  

</body> 

</html>
